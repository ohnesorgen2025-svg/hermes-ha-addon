name: Hermes Agent
version: "0.6.1"
slug: hermes_agent
description: "The self-improving AI agent built by Nous Research. Slim fork for Raspberry Pi — Ollama Cloud and any OpenAI-compatible model provider + Telegram."
url: "https://github.com/ohnesorgen2025-svg/hermes-ha-addon"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: admin
map:
  - addon_config:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
ports:
  8443/tcp: null
ports_description:
  8443/tcp: "Hermes Gateway API (optional)"
options:
  model_provider: "ollama-cloud"
  model_api_key: ""
  ollama_api_key: ""
  ollama_model: "hermes3:latest"
  model: ""
  model_base_url: ""
  extra_env: []
  telegram_bot_token: ""
  telegram_allowed_users: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  access_password: ""
  auto_update: false
schema:
  model_provider: "list(ollama-cloud|openrouter|deepseek|xai|anthropic|gemini|zai|nvidia|huggingface|custom|manual)"
  model_api_key: "password?"
  ollama_api_key: "str"
  ollama_model: "str"
  model: "str?"
  model_base_url: "str?"
  extra_env:
    - "str"
  telegram_bot_token: "str"
  telegram_allowed_users: "str"
  mqtt_host: "str"
  mqtt_port: "port"
  mqtt_user: "str"
  mqtt_password: "password"
  access_password: "str"
  auto_update: "bool"
