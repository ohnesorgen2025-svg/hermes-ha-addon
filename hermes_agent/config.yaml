name: Hermes Agent
version: "0.6.11"
slug: hermes_agent
description: "The self-improving AI agent built by Nous Research. Slim fork for Raspberry Pi — Ollama Cloud and any OpenAI-compatible model provider + Telegram."
url: "https://github.com/ohnesorgen2025-svg/hermes-ha-addon"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: admin
map:
  - addon_config:rw
  - homeassistant_config:rw
  - media:rw
  - share:rw
ports:
  8443/tcp: null
ports_description:
  8443/tcp: "Hermes Gateway API (optional)"
options:
  providers: []
  default_provider: "ollama-cloud"
  default_api_key: ""
  default_model: "hermes3:latest"
  model_base_url: ""
  telegram_bot_token: ""
  telegram_allowed_users: ""
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  access_password: ""
  hermes_ref: ""
  auto_update: false
schema:
  providers:
    - provider: "list(ollama-cloud|openrouter|deepseek|xai|anthropic|gemini|zai|nvidia|huggingface|custom)"
      api_key: "password"
  default_provider: "list(ollama-cloud|openrouter|deepseek|xai|anthropic|gemini|zai|nvidia|huggingface|custom|manual)"
  default_api_key: "password?"
  default_model: "str?"
  model_base_url: "str?"
  telegram_bot_token: "str"
  telegram_allowed_users: "str"
  mqtt_host: "str"
  mqtt_port: "port"
  mqtt_user: "str"
  mqtt_password: "password"
  access_password: "str"
  hermes_ref: "str?"
  auto_update: "bool"
