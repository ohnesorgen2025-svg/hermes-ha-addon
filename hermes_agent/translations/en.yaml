configuration:
  providers:
    name: Providers (add a key per provider)
    description: >-
      Optional list of providers you want available in the Telegram /model picker. Click "Add" for each one,
      pick the provider and paste its API key. The add-on stores each key under the correct variable for you —
      you never need to know variable names. Add only the providers you actually have a key for.
  default_provider:
    name: Default Provider (used at start)
    description: >-
      The provider Hermes uses when it starts. You can still switch live in Telegram with /model.
      "custom" = your own OpenAI-compatible endpoint (then set "Model Base URL"). "manual" = leave the config untouched.
  default_api_key:
    name: API Key (for the default provider)
    description: >-
      API key for the Default Provider above. Leave empty if you already added this provider in the list above
      or if it needs no key.
  default_model:
    name: Default Model (model name at start)
    description: >-
      Model name used at startup, e.g. hermes3:latest, deepseek-chat, grok-4, claude-sonnet-4.6.
      Leave empty to use the provider's default.
  model_base_url:
    name: Model Base URL (advanced, usually empty)
    description: >-
      Leave EMPTY for known providers. Only set this for Default Provider = custom with your own OpenAI-compatible
      endpoint, e.g. https://my-endpoint.example.com/v1.
  telegram_bot_token:
    name: Telegram Bot Token
    description: Telegram bot token used by Hermes Agent.
  telegram_allowed_users:
    name: Telegram Allowed Users
    description: Comma-separated Telegram user IDs allowed to use the bot.
  mqtt_host:
    name: MQTT Host
    description: MQTT broker host for Zigbee2MQTT, usually core-mosquitto on Home Assistant OS.
  mqtt_port:
    name: MQTT Port
    description: MQTT broker port.
  mqtt_user:
    name: MQTT Username
    description: Optional MQTT username for Mosquitto or Zigbee2MQTT.
  mqtt_password:
    name: MQTT Password
    description: Optional MQTT password for Mosquitto or Zigbee2MQTT.
  access_password:
    name: Access Password
    description: Optional Hermes Gateway API key for external clients.
  auto_update:
    name: Auto Update
    description: >-
      Track the Hermes runtime fork's main branch on add-on start instead of using the pinned release revision.
